#Encoder config -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#Layer LED config -------------------
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y

# ======================================
# ZMK Studio / DYA Studio (Central)
# ======================================
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y

# BLE connection slots
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# DYA Studio: BLE management
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# DYA Studio: Battery history
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y
CONFIG_ZMK_BATTERY_SKIP_IF_USB_POWERED=n

# DYA Studio: Settings RPC
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# Split relay
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768

# DYA Studio: Runtime Input Processor (trackball)
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# DYA Studio: Runtime Sensor Rotate (encoder)
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y

# Settings persistence
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# ======================================
# Bluetooth stability tuning
# ======================================

# BLE connection interval: 7.5ms-15ms (fast response, stable link)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# Supervision timeout: 4s (default 0.42s is too short, causes disconnects)
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# TX power: boost to max for stronger signal
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Connection parameter update retries
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=5000

# BLE LLCP timeout extension (prevents premature disconnects)
CONFIG_BT_CTLR_LLCP_CONN_TIMEOUT=10000

# Split keyboard BLE reconnection stability
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n
CONFIG_ZMK_SPLIT_BLE_PREF_WEAK_BOND=n

# Heap memory expansion (freeze prevention)
CONFIG_HEAP_MEM_POOL_SIZE=24576
CONFIG_BT_RX_STACK_SIZE=2560
CONFIG_BT_HCI_TX_STACK_SIZE=1536

# System workqueue stack size (prevents stack overflow on BT events)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# BLE controller buffer tuning
CONFIG_BT_BUF_ACL_TX_COUNT=6
CONFIG_BT_BUF_ACL_TX_SIZE=69
CONFIG_BT_CTLR_RX_BUFFERS=6
CONFIG_BT_L2CAP_TX_BUF_COUNT=6
