#Encoder config -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# DYA Studio: Battery history (Peripheral)
CONFIG_ZMK_BATTERY_HISTORY=y

# DYA Studio: Settings RPC (Peripheral)
CONFIG_ZMK_SETTINGS_RPC=y

# Split relay
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# Settings persistence
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# ======================================
# Bluetooth stability tuning (Peripheral)
# ======================================

# TX power: boost to max for stronger signal
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Heap memory expansion (freeze prevention)
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096